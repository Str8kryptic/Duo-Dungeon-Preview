name: Step reward tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/_shared/step-rewards.ts"
      - "supabase/functions/_shared/step-rewards.test.ts"
      - "supabase/functions/_shared/step-date.ts"
      - "supabase/functions/_shared/step-date.test.ts"
      - "supabase/functions/_shared/step-baseline.ts"
      - "supabase/functions/_shared/step-baseline.test.ts"
      - "supabase/functions/_shared/step-catalog.ts"
      - "supabase/functions/step-reward-sync/index.ts"
      - ".github/workflows/step-reward-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run step reward tests
        run: deno test --no-check supabase/functions/_shared/step-rewards.test.ts
