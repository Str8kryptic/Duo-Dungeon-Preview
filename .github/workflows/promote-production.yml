name: Propose Production promotion after successful Development deploy

on:
  workflow_run:
    workflows: ["Deploy Duo Dungeon Preview"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: propose-production-promotion
  cancel-in-progress: true

jobs:
  propose-production:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact Development commit
        uses: actions/checkout@v4
        with:
          ref: main
          path: development
          fetch-depth: 1

      - name: Skip stale preview deployments
        id: freshness
        shell: bash
        run: |
          if [ "$(git -C development rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A newer Development commit exists; waiting for its Preview deployment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Production
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: main
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: production
          fetch-depth: 1

      - name: Verify Development and Production account isolation
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          dev_auth = Path("development/auth.js").read_text()
          prod_auth = Path("production/auth.js").read_text()

          def project_url(source, label):
              match = re.search(r'PROJECT_URL\s*=\s*"([^"]+)"', source)
              if not match:
                  raise SystemExit(f"BLOCKED: {label} Supabase project URL is missing.")
              return match.group(1)

          dev_url = project_url(dev_auth, "Development")
          prod_url = project_url(prod_auth, "Production")

          expected_dev = "https://xuxwwpfeenaaxzfspiiq.supabase.co"
          expected_prod = "https://cbndsdcotvnfkhfjrxst.supabase.co"

          if dev_url != expected_dev:
              raise SystemExit("BLOCKED: Development auth.js is not pointed at the approved Development project.")
          if prod_url != expected_prod:
              raise SystemExit("BLOCKED: Production auth.js is not pointed at the approved Production project.")
          if dev_url == prod_url:
              raise SystemExit("BLOCKED: Development and Production share the same Supabase project.")

          if "duo-dungeon-dev-auth-token-v1" not in dev_auth:
              raise SystemExit("BLOCKED: Development auth storage namespace is missing.")
          if "duo-dungeon-dev-auth-token-v1" in prod_auth:
              raise SystemExit("BLOCKED: Development auth storage namespace leaked into Production.")

          print("PASS: Development and Production use distinct, approved Supabase projects.")
          print("PASS: Development auth storage namespace is isolated.")
          PY

      - name: Stage approved application files
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only environment-neutral assets are eligible for automatic staging.
          # app.js, auth.js, index.html, setup.html, and dev-tools files remain
          # environment-specific until a dedicated production-safe build step exists.
          files=(
            game-data.js
            sync.js
            styles.css
          )
          for file in "${files[@]}"; do
            test -f "development/$file"
            cp "development/$file" "production/$file"
          done
          if [ -d development/assets ]; then
            mkdir -p production/assets
            cp -R development/assets/. production/assets/
          fi
          # Production's Pages workflow, domain configuration, and repository
          # settings are deliberately not copied from Development.

      - name: Create or update the single Production promotion pull request
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd production
          # Reuse one stable branch so each verified Development build refreshes
          # the same review request instead of creating a new PR.
          branch="promotion/development-latest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          git add game-data.js sync.js styles.css assets 2>/dev/null || git add game-data.js sync.js styles.css
          if git diff --cached --quiet; then
            echo "Development and Production application files already match."
            exit 0
          fi
          git commit -m "Promote verified Development build to Production"
          git push --force-with-lease origin "$branch"
          body="Automated proposal containing environment-neutral shared assets only.

          Development commit: $SOURCE_SHA

          Environment-specific files (auth.js, app.js, index.html, setup.html, and developer tools) are deliberately excluded. Review before merging; Production deployment remains a separate, explicit action."
          existing_pr="$(gh pr list --repo Str8kryptic/Duo-Dungeon --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo Str8kryptic/Duo-Dungeon \
              --title "Promote shared assets from verified Development build" \
              --body "$body"
            echo "Updated existing Production promotion PR #$existing_pr."
          else
            gh pr create --repo Str8kryptic/Duo-Dungeon --base main --head "$branch" \
              --title "Promote shared assets from verified Development build" \
              --body "$body"
          fi
