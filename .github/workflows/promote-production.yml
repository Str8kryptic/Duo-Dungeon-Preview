name: Manually propose Production promotion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: propose-production-promotion
  cancel-in-progress: true

jobs:
  propose-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact Development source
        uses: actions/checkout@v4
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development
          fetch-depth: 1

      - name: Check out Production main
        uses: actions/checkout@v4
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: main
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: production
          fetch-depth: 0

      - name: Verify Development and Production account isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          dev_auth = Path("development/auth.js").read_text()
          prod_auth = Path("production/auth.js").read_text()

          def project_url(source, label):
              match = re.search(r'PROJECT_URL\\s*=\\s*"([^"]+)"', source)
              if not match:
                  raise SystemExit(f"BLOCKED: {label} Supabase project URL is missing.")
              return match.group(1)

          dev_url = project_url(dev_auth, "Development")
          prod_url = project_url(prod_auth, "Production")
          if dev_url != "https://xuxwwpfeenaaxzfspiiq.supabase.co":
              raise SystemExit("BLOCKED: Development is not pointed at its approved Supabase project.")
          if prod_url != "https://cbndsdcotvnfkhfjrxst.supabase.co":
              raise SystemExit("BLOCKED: Production is not pointed at its approved Supabase project.")
          if dev_url == prod_url:
              raise SystemExit("BLOCKED: Development and Production share a Supabase project.")
          if "duo-dungeon-dev-auth-token-v1" not in dev_auth or "duo-dungeon-dev-auth-token-v1" in prod_auth:
              raise SystemExit("BLOCKED: Development auth storage isolation failed.")
          print("PASS: Development and Production accounts are isolated.")
          PY

      - name: Stage only shared assets on a separate Production proposal branch
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          cd production
          branch="promotion/production-shared-assets-latest"
          git fetch origin main
          git checkout -B "$branch" origin/main
          cd ..
          for file in game-data.js sync.js styles.css; do
            test -f "development/$file"
            cp "development/$file" "production/$file"
          done
          if [ -d development/assets ]; then
            mkdir -p production/assets
            cp -R development/assets/. production/assets/
          fi
          cd production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-data.js sync.js styles.css assets
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No shared asset changes to propose."
          else
            git commit -m "Propose verified shared assets from Development"
            git push --force origin "$branch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$(git -C ../development rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update the Production review pull request
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          SOURCE_SHA: ${{ steps.stage.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="Manual proposal containing shared assets only.\n\nDevelopment source: $SOURCE_SHA\n\nThis workflow is manually triggered. It does not deploy Production. Environment-specific files are excluded."
          existing_pr="$(gh pr list --repo Str8kryptic/Duo-Dungeon --state open --head promotion/production-shared-assets-latest --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo Str8kryptic/Duo-Dungeon --title "Promote shared assets from Development" --body "$body"
          else
            gh pr create --repo Str8kryptic/Duo-Dungeon --base main --head promotion/production-shared-assets-latest --title "Promote shared assets from Development" --body "$body"
          fi
