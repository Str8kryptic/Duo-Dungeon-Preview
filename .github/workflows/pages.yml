name: Deploy Duo Dungeon Preview
# Refresh deployment: stage the latest promotion/development-latest source on every preview deploy.
# Phase 4 refresh: republish the latest isolated feature branch after route and combat UI updates (2026-11-13).
# Rebuild after keeping the expedition route visible alongside an active encounter.
# Rebuild after aligning the active-Hunt boss-gate contract assertion with disabled encounter actions.
# Rebuild for closed Hunt accordions, distinct floor boss visuals and mobile header overflow fix.
# Re-run the isolated Phase 4 contract suite after fixing the native-details whitespace matcher.
# Republish shared horizontal count/status labels across all Hunt panels (2026-11-13).
# Re-stage the latest Phase 4 branch head after its matching contract suite passed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [development-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout latest Development source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview verification
        if: github.event_name != 'pull_request'
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      # Re-run deployment after the global backdrop replacement and cache-bust.
      - name: Verify approved global dungeon background
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          background_url="https://xuxwwpfeenaaxzfspiiq.supabase.co/storage/v1/object/public/Duo-dungeon-backgrounds/MainBackDrop.jpeg"
          grep -Fq "$background_url" visual/pages/unified-stone-background.css
          curl --fail --silent --show-error --location --output /dev/null "$background_url"
          echo "PASS: approved Supabase background is configured and publicly reachable."
      - name: Check out isolated Phase 4 source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: phase4/activity-engine-gathering-crafting
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: phase4-source
      - name: Stage isolated Phase 4 preview
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p phase4
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' phase4-source/ phase4/
      - name: Check application syntax
        shell: bash
        run: |
          failures=0

          run_check() {
            label="$1"
            shift
            echo "::group::Check: $label"
            if "$@"; then
              echo "PASS: $label"
            else
              status=$?
              echo "::error title=Verification failed::$label (exit code $status)"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }

          run_check "Application JavaScript syntax" node --check app.js
          run_check "Guild JavaScript syntax" node --check guild.js
          run_check "Guild migration and contract tests" node scripts/test-guild.mjs
          run_check "Hunt economy regression tests" node scripts/test-hunt-economy.mjs
          run_check "Activity Ledger regression tests" node scripts/test-activity-engine.mjs
          run_check "Adventurer's Path tests" node scripts/test-adventurers-path.mjs
          run_check "Adventurer's Path JavaScript syntax" node --check adventurers-path.js
          run_check "Authentication JavaScript syntax" node --check auth.js
          run_check "Developer tools JavaScript syntax" node --check dev-tools.js
          run_check "RPG combat JavaScript syntax" node --check rpg-combat.js
          run_check "RPG combat regression tests" node scripts/test-rpg-combat.mjs
          run_check "Activity Ledger JavaScript syntax" node --check activity-engine.js
          run_check "Retired step-reward endpoint returns HTTP 410" grep -q '}, 410);' supabase/functions/step-reward-sync/index.ts
          run_check "Legacy Treasury only exchanges existing Marks" bash -c "grep -q 'LEGACY TREASURY MARKS' app.js && grep -q 'Health sync no longer generates Marks or reserve energy' app.js"
          run_check "Historical step records remain in save schema" grep -q 'stepLifetime' app.js
          run_check "New saves do not receive a step reserve" bash -c "! grep -q 'bankedSteps:10000' app.js"

          if [ "$failures" -gt 0 ]; then
            echo "::error title=Verification summary::$failures check(s) failed. See the named checks above."
            exit 1
          fi
          echo "All application verification checks passed."
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'development-updated')
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout latest Development source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview deployment
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      - name: Check out isolated Phase 4 source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: phase4/activity-engine-gathering-crafting
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: phase4-source
      - name: Stage isolated Phase 4 preview
        run: |
          mkdir -p phase4
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' phase4-source/ phase4/
      # Chapter One is an isolated, additive site. The legacy preview is never replaced.
      - name: Prepare Node 22 for Chapter One release verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage verified Chapter One v9.4 release when available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          repo='Str8kryptic/Duo-Dungeon'
          tag='chapter-one-sci-fi-v9.4'
          archive='Duo_Dungeon_Chapter_One_All_35_Floor_Art_Integrated_v9_4.zip'
          asset_names="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if ! grep -Eq "^($archive|$archive\\.part01)$" <<< "$asset_names"; then
            echo 'Full Chapter One archive not attached; allow Lite release fallback.'
          else
            stage="$(mktemp -d)"
            if grep -Fxq "$archive" <<< "$asset_names"; then
              gh release download "$tag" --repo "$repo" --pattern "$archive" --dir "$stage"
            else
              gh release download "$tag" --repo "$repo" --pattern "$archive.part*" --dir "$stage"
              for i in 01 02 03 04 05 06; do
                test -s "$stage/$archive.part$i" || { echo "::error::Missing archive part$i"; exit 1; }
              done
              cat "$stage/$archive.part"{01,02,03,04,05,06} > "$stage/$archive"
            fi
            echo "ab1bef6271067034da7c19df39e7b1c08cecd210db4503baa6fb5e5b99f44766  $stage/$archive" | sha256sum -c -
            unzip -q "$stage/$archive" -d "$stage"
            source_dir="$stage/duo-dungeon-registry-pack"
            test -f "$source_dir/src/app.js"
            test -f "$source_dir/data/asset_registry.json"
            (cd "$source_dir" && npm test && npm run validate && npm run qa:chapter-one)
            python3 -c 'import hashlib,json,pathlib,sys;root=pathlib.Path(sys.argv[1]);a=json.loads((root/"data/asset_registry.json").read_text());f=[x for x in a if x.get("entityType")=="floor"];assert len(f)==35;assert all(x["path"].endswith(".png") and (root/x["path"]).is_file() and (not x.get("sha256") or hashlib.sha256((root/x["path"]).read_bytes()).hexdigest()==x["sha256"]) for x in f)' "$source_dir"
            mkdir -p chapter-one-alpha/src chapter-one-alpha/data chapter-one-alpha/assets
            cp "$source_dir/index.html" "$source_dir/styles.css" "$source_dir/package.json" chapter-one-alpha/
            rsync -a "$source_dir/src/" chapter-one-alpha/src/
            rsync -a "$source_dir/data/" chapter-one-alpha/data/
            rsync -a "$source_dir/assets/" chapter-one-alpha/assets/
            echo 'PASS: original full-art v9.4 staged under /chapter-one-alpha/.'
          fi
      - name: Stage verified playable Lite Chapter One if full release is unavailable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          repo='Str8kryptic/Duo-Dungeon'
          if gh release view chapter-one-sci-fi-v9.4 --repo "$repo" --json assets --jq '.assets[].name' 2>/dev/null | grep -Eq '^Duo_Dungeon_Chapter_One_All_35_Floor_Art_Integrated_v9_4[.]zip([.]part01)?
            echo 'Full release is available; keep full-quality runtime staging.'
          else
            lite_tag='chapter-one-sci-fi-v9.4-lite'
            lite_zip='Duo_Dungeon_Chapter_One_Playable_Lite_v9_4.zip'
            lite_url='https://github.com/user-attachments/files/34939853/Duo_Dungeon_Chapter_One_Playable_Lite_v9_4.zip'
            gh release view "$lite_tag" --repo "$repo" >/dev/null
            stage="$(mktemp -d)"
            # This release carries a GitHub user-attachment in its description, not a GitHub Release asset.
            curl --fail --location --retry 3 --silent --show-error "$lite_url" -o "$stage/$lite_zip"
            echo "6ed291a091b19d13c1c132c14f5f59c208ef3ec4d8e07ce1d1925ce557c79df3  $stage/$lite_zip" | sha256sum -c -
            unzip -q "$stage/$lite_zip" -d "$stage/app"
            test -f "$stage/app/src/app.js"
            test -f "$stage/app/data/asset_registry.json"
            # Lite intentionally uses archived SVGs instead of production PNG masters.
            # Run all gameplay and contract suites; full-raster provenance suites remain mandatory for the full release.
            (cd "$stage/app" && node --test $(find tests -maxdepth 1 -name '*.test.js' ! -name 'art-production.test.js' ! -name 'floor-art-production.test.js' ! -name 'svg-raster-migration.test.js' | sort) && npm run validate && npm run qa:chapter-one)
            mkdir -p chapter-one-alpha
            cp "$stage/app/index.html" "$stage/app/styles.css" "$stage/app/package.json" chapter-one-alpha/
            rsync -a "$stage/app/src/" chapter-one-alpha/src/
            rsync -a "$stage/app/data/" chapter-one-alpha/data/
            rsync -a "$stage/app/assets/" chapter-one-alpha/assets/
            echo 'PASS: exact playable Lite v9.4 installed under /chapter-one-alpha/, no legacy files replaced.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
# Trigger Preview to pick up the latest approved Development shell repair.

