name: Deploy Duo Dungeon Preview
# Refresh deployment: stage the latest promotion/development-latest source on every preview deploy.
# Phase 4 refresh: republish the latest isolated feature branch after route and combat UI updates (2026-11-13).
# Rebuild after keeping the expedition route visible alongside an active encounter.
# Rebuild after aligning the active-Hunt boss-gate contract assertion with disabled encounter actions.
# Rebuild for closed Hunt accordions, distinct floor boss visuals and mobile header overflow fix.
# Re-run the isolated Phase 4 contract suite after fixing the native-details whitespace matcher.
# Republish shared horizontal count/status labels across all Hunt panels (2026-11-13).
# Re-stage the latest Phase 4 branch head after its matching contract suite passed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [development-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  # Do not terminate site artifact upload/deployment when a new Preview run arrives.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout latest Development source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview verification
        if: github.event_name != 'pull_request'
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      - name: Checkout isolated Orb rebuild for login verification
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: feature/orb-v2-equipment-pages-art
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: orb-rebuild-source
      - name: Checkout Weapons Authority (catalog data only)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: feature/orb-weapons-floor35-integration
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: weapon-authority-source
      - name: Verify isolated Orb login and gameplay prototype
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          (cd orb-rebuild-source && node --check app.js && node --check login.js && node --check orb-shell.js && node --check equipment-registry.js && node --check intro.js && node --check equipment-data.js && node --check equipment.js && node --test tests/login-static.test.js tests/equipment-ui.test.js tests/equipment-data.test.js)
          grep -q 'id="login-root"' orb-rebuild-source/index.html
          grep -Fq 'BEGIN DESCENT' orb-rebuild-source/login.js
          grep -Fq 'id="campaign-runtime"' orb-rebuild-source/index.html
          node --check orb-rebuild-source/intro.js
          grep -Fq 'floor-ten-briefing' orb-rebuild-source/intro.html
      # Re-run deployment after the global backdrop replacement and cache-bust.
      - name: Verify approved global dungeon background
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          background_url="https://xuxwwpfeenaaxzfspiiq.supabase.co/storage/v1/object/public/Duo-dungeon-backgrounds/MainBackDrop.jpeg"
          grep -Fq "$background_url" visual/pages/unified-stone-background.css
          curl --fail --silent --show-error --location --output /dev/null "$background_url"
          echo "PASS: approved Supabase background is configured and publicly reachable."
      - name: Check out isolated Phase 4 source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: phase4/activity-engine-gathering-crafting
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: phase4-source
      - name: Stage isolated Phase 4 preview
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p phase4
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' phase4-source/ phase4/
      - name: Check application syntax
        shell: bash
        run: |
          failures=0

          run_check() {
            label="$1"
            shift
            echo "::group::Check: $label"
            if "$@"; then
              echo "PASS: $label"
            else
              status=$?
              echo "::error title=Verification failed::$label (exit code $status)"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }

          run_check "Application JavaScript syntax" node --check app.js
          run_check "Guild JavaScript syntax" node --check guild.js
          run_check "Guild migration and contract tests" node scripts/test-guild.mjs
          run_check "Hunt economy regression tests" node scripts/test-hunt-economy.mjs
          run_check "Activity Ledger regression tests" node scripts/test-activity-engine.mjs
          run_check "Adventurer's Path tests" node scripts/test-adventurers-path.mjs
          run_check "Adventurer's Path JavaScript syntax" node --check adventurers-path.js
          run_check "Authentication JavaScript syntax" node --check auth.js
          run_check "Developer tools JavaScript syntax" node --check dev-tools.js
          run_check "RPG combat JavaScript syntax" node --check rpg-combat.js
          run_check "RPG combat regression tests" node scripts/test-rpg-combat.mjs
          run_check "Activity Ledger JavaScript syntax" node --check activity-engine.js
          run_check "Retired step-reward endpoint returns HTTP 410" grep -q '}, 410);' supabase/functions/step-reward-sync/index.ts
          run_check "Legacy Treasury only exchanges existing Marks" bash -c "grep -q 'LEGACY TREASURY MARKS' app.js && grep -q 'Health sync no longer generates Marks or reserve energy' app.js"
          run_check "Historical step records remain in save schema" grep -q 'stepLifetime' app.js
          run_check "New saves do not receive a step reserve" bash -c "! grep -q 'bankedSteps:10000' app.js"

          if [ "$failures" -gt 0 ]; then
            echo "::error title=Verification summary::$failures check(s) failed. See the named checks above."
            exit 1
          fi
          echo "All application verification checks passed."
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'development-updated')
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout latest Development source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview deployment
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      - name: Check out isolated Phase 4 source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: phase4/activity-engine-gathering-crafting
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: phase4-source
      - name: Stage isolated Phase 4 preview
        run: |
          mkdir -p phase4
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' phase4-source/ phase4/
      # The clean-slate Orb game is additive; never replace legacy Development or Chapter One.
      - name: Checkout isolated Orb rebuild source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: feature/orb-v2-equipment-pages-art
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: orb-rebuild-source
      - name: Checkout Weapons Authority for staged in-game catalog
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: feature/orb-weapons-floor35-integration
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: weapon-authority-source
      - name: Stage isolated Orb login and guest game under /orb-rebuild/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p orb-rebuild/assets
          cp orb-rebuild-source/index.html orb-rebuild-source/styles.css orb-rebuild-source/app.js orb-rebuild-source/login.css orb-rebuild-source/login.js orb-rebuild-source/equipment.css orb-rebuild-source/equipment-data.js orb-rebuild-source/equipment.js orb-rebuild-source/orb-shell.js orb-rebuild-source/orb-shell.css orb-rebuild-source/equipment-registry.js orb-rebuild-source/phase0.html orb-rebuild/
          cp orb-rebuild-source/intro.html orb-rebuild-source/intro.css orb-rebuild-source/intro.js orb-rebuild/
          node --check orb-rebuild/intro.js
          test -s orb-rebuild/intro.html
          test -s orb-rebuild/orb-shell.js
          test -s orb-rebuild/phase0.html
          grep -Fq 'id="campaign-runtime"' orb-rebuild/index.html
          cp orb-rebuild-source/assets/*.svg orb-rebuild/assets/
          test -s orb-rebuild/index.html
          test -s orb-rebuild/assets/orb-login.svg
          test -s orb-rebuild/assets/refuge-floor0.svg
          test -s orb-rebuild/assets/area-armory.svg
          test -s orb-rebuild/assets/area-gates.svg
          test -s orb-rebuild/equipment.js
          test -s orb-rebuild/equipment-data.js
          grep -q 'id="login-root"' orb-rebuild/index.html
      # Chapter One is an isolated, additive site. The legacy preview is never replaced.
      - name: Prepare Node 22 for Chapter One release verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage verified Chapter One v9.4 release when available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          repo='Str8kryptic/Duo-Dungeon'
          tag='chapter-one-sci-fi-v9.4'
          archive='Duo_Dungeon_Chapter_One_All_35_Floor_Art_Integrated_v9_4.zip'
          asset_names="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if ! grep -Eq "^($archive|$archive\\.part01)$" <<< "$asset_names"; then
            echo 'Full Chapter One archive not attached; allow Lite release fallback.'
          else
            stage="$(mktemp -d)"
            if grep -Fxq "$archive" <<< "$asset_names"; then
              gh release download "$tag" --repo "$repo" --pattern "$archive" --dir "$stage"
            else
              gh release download "$tag" --repo "$repo" --pattern "$archive.part*" --dir "$stage"
              for i in 01 02 03 04 05 06; do
                test -s "$stage/$archive.part$i" || { echo "::error::Missing archive part$i"; exit 1; }
              done
              cat "$stage/$archive.part"{01,02,03,04,05,06} > "$stage/$archive"
            fi
            echo "ab1bef6271067034da7c19df39e7b1c08cecd210db4503baa6fb5e5b99f44766  $stage/$archive" | sha256sum -c -
            unzip -q "$stage/$archive" -d "$stage"
            source_dir="$stage/duo-dungeon-registry-pack"
            test -f "$source_dir/src/app.js"
            test -f "$source_dir/data/asset_registry.json"
            (cd "$source_dir" && npm test && npm run validate && npm run qa:chapter-one)
            python3 -c 'import hashlib,json,pathlib,sys;root=pathlib.Path(sys.argv[1]);a=json.loads((root/"data/asset_registry.json").read_text());f=[x for x in a if x.get("entityType")=="floor"];assert len(f)==35;assert all(x["path"].endswith(".png") and (root/x["path"]).is_file() and (not x.get("sha256") or hashlib.sha256((root/x["path"]).read_bytes()).hexdigest()==x["sha256"]) for x in f)' "$source_dir"
            mkdir -p chapter-one-alpha/src chapter-one-alpha/data chapter-one-alpha/assets
            cp "$source_dir/index.html" "$source_dir/styles.css" "$source_dir/package.json" chapter-one-alpha/
            rsync -a "$source_dir/src/" chapter-one-alpha/src/
            rsync -a "$source_dir/data/" chapter-one-alpha/data/
            rsync -a "$source_dir/assets/" chapter-one-alpha/assets/
            echo 'PASS: original full-art v9.4 staged under /chapter-one-alpha/.'
          fi
      - name: Stage verified playable Lite v9.5 with approved Warden art when available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          repo='Str8kryptic/Duo-Dungeon'
          full_assets="$(gh release view chapter-one-sci-fi-v9.4 --repo "$repo" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -Eq '^Duo_Dungeon_Chapter_One_All_35_Floor_Art_Integrated_v9_4[.]zip([.]part01)?$' <<< "$full_assets"; then
            echo 'Full-art Chapter One staged by the preceding step; retain it.'
          else
            lite_tag='chapter-one-sci-fi-v9.4-lite'
            lite_assets="$(gh release view "$lite_tag" --repo "$repo" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            v95='Duo_Dungeon_Chapter_One_Playable_Lite_v9_5_Warden_Integrated.zip'
            v94='Duo_Dungeon_Chapter_One_Playable_Lite_v9_4.zip'
            if grep -Fxq "$v95" <<< "$lite_assets"; then
              lite_zip="$v95"
              expected='2f40dc7ed9e5d59df108ba1d333fe224452119e53c68c8c2f13a3ea4dc92799c'
              is_warden_v95=true
            elif grep -Fxq "$v94" <<< "$lite_assets"; then
              lite_zip="$v94"
              expected='6ed291a091b19d13c1c132c14f5f59c208ef3ec4d8e07ce1d1925ce557c79df3'
              is_warden_v95=false
            else
              echo 'No downloadable Chapter One Lite asset yet; preserve framework preview.'
              exit 0
            fi
            stage="$(mktemp -d)"
            gh release download "$lite_tag" --repo "$repo" --pattern "$lite_zip" --dir "$stage"
            echo "$expected  $stage/$lite_zip" | sha256sum -c -
            mkdir -p "$stage/app"
            unzip -q "$stage/$lite_zip" -d "$stage/app"
            test -f "$stage/app/src/app.js"
            test -f "$stage/app/data/asset_registry.json"
            if [ "$is_warden_v95" = true ]; then
              test -s "$stage/app/assets/enemies/enm_warden_enforcer.png"
              test -s "$stage/app/assets/thumbnails/enemies/enm_warden_enforcer_128.png"
              test -s "$stage/app/assets/thumbnails/enemies/enm_warden_enforcer_256.png"
              python3 .github/scripts/validate-chapter-one-warden-v95.py "$stage/app"
            fi
            # Compatible Lite tests; production raster provenance still requires original full-art release.
            (cd "$stage/app" && node --test $(find tests -maxdepth 1 -name '*.test.js' ! -name 'art-production.test.js' ! -name 'floor-art-production.test.js' ! -name 'svg-raster-migration.test.js' | sort) && npm run validate && npm run qa:chapter-one)
            mkdir -p chapter-one-alpha
            cp "$stage/app/index.html" "$stage/app/styles.css" "$stage/app/package.json" chapter-one-alpha/
            rsync -a "$stage/app/src/" chapter-one-alpha/src/
            rsync -a "$stage/app/data/" chapter-one-alpha/data/
            rsync -a "$stage/app/assets/" chapter-one-alpha/assets/
            echo "PASS: validated $lite_zip staged under /chapter-one-alpha/ without replacing legacy preview."
          fi
      - name: Stage validated Chapter One Lite game for Floor 1–10 tutorial campaign
        shell: bash
        run: |
          set -euo pipefail
          # The audited Chapter One runtime retains its original 35-floor data.
          # This preview milestone assesses the Refuge, tutorial and Floors 1–10.
          # Do not truncate canonical floor records or substitute a mock combat engine.
          test -s chapter-one-alpha/src/app.js
          test -s chapter-one-alpha/data/asset_registry.json
          test -s chapter-one-alpha/index.html
          mkdir -p orb-rebuild/equipment-catalog
          cp weapon-authority-source/weapons/weapon-catalog.json weapon-authority-source/weapons/weapon-release-manifest.json orb-rebuild/equipment-catalog/
          node --check orb-rebuild/equipment-registry.js
          node - <<'NODE'
          const fs=require('node:fs');
          const path='orb-rebuild/equipment-catalog/';
          const catalog=JSON.parse(fs.readFileSync(path+'weapon-catalog.json'));
          const release=JSON.parse(fs.readFileSync(path+'weapon-release-manifest.json'));
          if(Object.keys(catalog.families||{}).length!==15 || release.launchBaseCount!==90 || release.expansionBaseCount!==60 || release.expansionSpecialCount!==13 || release.maxLaunchFloor!==35)throw Error('Weapon authority scope mismatch');
          if(release.entries.filter(e=>e.release==='launch-floor-35' && e.minFloor<=10).length!==45)throw Error('Floor 1-10 weapon concept gates mismatch');
          console.log('PASS: canonical Weapons branch staged for in-game catalog, all real acquisition/combat gates unchanged');
          NODE
          mkdir -p orb-rebuild/campaign
          rsync -a chapter-one-alpha/ orb-rebuild/campaign/
          # Apply the exact UI-event fix ONLY to the staged Preview copy.
          # Original release checksums, data, catalogs, and combat handlers remain unchanged.
          python3 orb-rebuild-source/scripts/patch-chapter-one-floor-actions.py orb-rebuild/campaign/src/app.js
          node --check orb-rebuild/campaign/src/app.js
          grep -Fq 'if(b.dataset.floor&&!b.dataset.action)' orb-rebuild/campaign/src/app.js
          # Preserve validated Chapter One combat and content; overlay only accessibility CSS/JS.
          cp orb-rebuild-source/campaign-ux.css orb-rebuild-source/campaign-ux.js orb-rebuild/campaign/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("orb-rebuild/campaign/index.html")
          html=p.read_text()
          assert "</head>" in html and "</body>" in html
          assert "campaign-ux.css" not in html and "campaign-ux.js" not in html
          html=html.replace("</head>",'<link rel="stylesheet" href="./campaign-ux.css"></head>',1)
          html=html.replace("</body>",'<script src="./campaign-ux.js" defer></script></body>',1)
          p.write_text(html)
          PY
          node --check orb-rebuild/campaign/campaign-ux.js
          test -s orb-rebuild/campaign/campaign-ux.css
          grep -Fq 'campaign-ux.js' orb-rebuild/campaign/index.html
          test -s orb-rebuild/campaign/src/app.js
          test -s orb-rebuild/campaign/data/asset_registry.json
          echo 'PASS: verified Chapter One runtime available at /orb-rebuild/campaign/ for Floor 1–10 milestone.'
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test live isolated Orb login after Pages deployment
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          base="https://str8kryptic.github.io/Duo-Dungeon-Preview/orb-rebuild"
          folder="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/" -o "$folder/index.html"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/login.js" -o "$folder/login.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/assets/orb-login.svg" -o "$folder/orb-login.svg"
          grep -Fq 'id="login-root"' "$folder/index.html"
          grep -Fq 'BEGIN DESCENT' "$folder/login.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/equipment.js" -o "$folder/equipment.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/assets/area-armory.svg" -o "$folder/armory.svg"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/assets/area-gates.svg" -o "$folder/gates.svg"
          grep -Fq 'Tactical Dressing Deck' "$folder/equipment.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/equipment-data.js" -o "$folder/equipment-data.js"
          grep -Fq 'getSnapshot:normalize' "$folder/equipment-data.js"
          grep -Fq 'HIDE ART CONCEPT PREVIEW' "$folder/equipment.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/intro.html" -o "$folder/intro.html"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/intro.js" -o "$folder/intro.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/campaign/" -o "$folder/campaign.html"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/campaign/src/app.js" -o "$folder/campaign-app.js"
          grep -Fq 'floor-ten-briefing' "$folder/intro.html"
          grep -Fq 'Duct Warden' "$folder/intro.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/orb-shell.js" -o "$folder/orb-shell.js"
          grep -Fq 'game.src = "./campaign/"' "$folder/orb-shell.js"
          grep -Fq 'id="campaign-runtime"' "$folder/index.html"
          grep -Fq 'BEGIN DESCENT' "$folder/login.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/equipment-registry.js" -o "$folder/equipment-registry.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/equipment-catalog/weapon-catalog.json" -o "$folder/weapon-catalog.json"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/equipment-catalog/weapon-release-manifest.json" -o "$folder/weapon-release-manifest.json"
          grep -Fq 'OrbEquipmentRegistry' "$folder/equipment-registry.js"
          test -s "$folder/campaign-app.js"
          grep -Fq 'if(b.dataset.floor&&!b.dataset.action)' "$folder/campaign-app.js"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/campaign/campaign-ux.js" -o "$folder/campaign-ux.js"
          grep -Fq 'window.scrollTo(0,0)' "$folder/campaign-ux.js"
          grep -Fq '<svg' "$folder/armory.svg"
          grep -Fq '<svg' "$folder/gates.svg"
          grep -Fq '<svg' "$folder/orb-login.svg"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$base/assets/refuge-floor0.svg" -o "$folder/refuge.svg"
          grep -Fq '<svg' "$folder/refuge.svg"
          echo "PASS: /orb-rebuild/ login, guest entry and Orb vector are live."
      - name: Smoke-test live Chapter One after Pages deployment
        if: success()
        run: python3 .github/scripts/check-chapter-one-live.py

      - name: Prepare browser driver for integrated Chapter One smoke test
        if: success()
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/orb-browser" --no-save playwright-core@1.58.2
      # Browser QA waits for the campaign document URL, not the iframe's initial blank document.
      # It also waits for the rendered Refuge and Explore UI after registry initialization.
      - name: Verify actual live Orb tutorial and embedded campaign at three viewport sizes
        if: success()
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/orb-browser/node_modules
          ORB_QA_OUTPUT: ${{ runner.temp }}/orb-campaign-qa
        run: |
          node orb-rebuild-source/tests/campaign-live-browser.cjs
      # Advance the tutorial in an isolated browser session to observe genuine exploration controls.
      # Refresh this QA after the live-HUD milestone overlay and expedition screen wait updates.
      # Include Refuge/Expedition Gate navigation diagnostics from the latest source branch.
      - name: Inspect real Chapter One Explore and Floor 10 controls
        if: success()
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/orb-browser/node_modules
        run: node orb-rebuild-source/tests/campaign-floor10-probe.cjs
      - name: Verify live Floor 1 choices, reload and objective progression
        if: success()
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/orb-browser/node_modules
        run: |
          node orb-rebuild-source/tests/campaign-floor1-regression.cjs
      - name: Verify integrated Weapons and Armor guide across mobile and desktop
        if: success()
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/orb-browser/node_modules
        run: node orb-rebuild-source/tests/equipment-authority-browser.cjs
      - name: Upload real campaign screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-integrated-campaign-qa
          path: ${{ runner.temp }}/orb-campaign-qa/
