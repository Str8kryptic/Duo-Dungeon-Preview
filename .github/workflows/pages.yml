name: Deploy Duo Dungeon Preview
# Refresh deployment: stage the latest promotion/development-latest source on every preview deploy.
# Phase 4 refresh: republish the latest isolated feature branch after route and combat UI updates (2026-11-13).
# Rebuild after keeping the expedition route visible alongside an active encounter.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [development-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout latest Development source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview verification
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      - name: Check out isolated Phase 4 source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: phase4/activity-engine-gathering-crafting
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: phase4-source
      - name: Stage isolated Phase 4 preview
        run: |
          mkdir -p phase4
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' phase4-source/ phase4/
      - name: Check application syntax
        shell: bash
        run: |
          failures=0

          run_check() {
            label="$1"
            shift
            echo "::group::Check: $label"
            if "$@"; then
              echo "PASS: $label"
            else
              status=$?
              echo "::error title=Verification failed::$label (exit code $status)"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }

          run_check "AI orb script exists" test -s assistant-orb.js
          run_check "AI orb script is loaded by index.html" grep -q 'assistant-orb.js' index.html
          run_check "AI orb mounts from app.js" grep -q 'DUO_ORB.mount(host)' app.js
          run_check "AI orb JavaScript syntax" node --check assistant-orb.js
          run_check "Application JavaScript syntax" node --check app.js
          run_check "Guild JavaScript syntax" node --check guild.js
          run_check "Adventurer's Guild tests" node scripts/test-guild.mjs
          run_check "Adventurer's Path tests" node scripts/test-adventurers-path.mjs
          run_check "Adventurer's Path JavaScript syntax" node --check adventurers-path.js
          run_check "Authentication JavaScript syntax" node --check auth.js
          run_check "Development test-email marker" grep -q 'SEND TEST EMAIL TO ME' dev-tools.js
          run_check "Game-update test function marker" grep -q 'sendTestGameUpdate' auth.js
          run_check "Health Connect JavaScript syntax" node --check health-connect.js
          run_check "RPG combat JavaScript syntax" node --check rpg-combat.js
          run_check "Health Connect tests" node scripts/test-health-connect.mjs
          run_check "RPG combat tests" node scripts/test-rpg-combat.mjs
          run_check "Location manifest includes Crawler Vault" grep -q '"assetId": "facility-bag"' visual/location-manifests.js
          run_check "Location manifest includes Step Treasury" grep -q '"assetId": "facility-treasury"' visual/location-manifests.js
          run_check "Facility grid resolves manifest assets" grep -q 'registry.getById&&location' app.js
          run_check "Sanctum art-direction marker" grep -q 'Sanctum art direction: weathered dungeon stone and iron' styles.css
          run_check "Dungeon Atmosphere 2.0 marker" grep -q 'DUNGEON ATMOSPHERE 2.0' styles.css
          run_check "Game-section marker" grep -q 'data-game-section' app.js
          run_check "Current Development Preview source verification" node scripts/test-preview-source.mjs
          run_check "Isolated Phase 4 Activity Engine contracts" node phase4/tests/phase4-activity-engine.test.cjs

          if [ "$failures" -gt 0 ]; then
            echo "::error title=Verification summary::$failures check(s) failed. See the named checks above."
            exit 1
          fi
          echo "All application verification checks passed."
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'development-updated')
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout latest Development source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview deployment
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      - name: Check out isolated Phase 4 source
        uses: actions/checkout@v7
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: phase4/activity-engine-gathering-crafting
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: phase4-source
      - name: Stage isolated Phase 4 preview
        run: |
          mkdir -p phase4
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' phase4-source/ phase4/
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5