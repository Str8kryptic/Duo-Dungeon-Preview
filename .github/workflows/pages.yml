name: Deploy Duo Dungeon Preview
# Refresh deployment: stage the latest promotion/development-latest source on every preview deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [development-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout latest Development source
        uses: actions/checkout@v4
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview verification
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      - name: Check application syntax
        run: |
          test -s assistant-orb.js
          grep -q 'assistant-orb.js' index.html
          grep -q 'DUO_ORB.mount(host)' app.js
          node --check assistant-orb.js
          node --check app.js
          node --check guild.js
          node scripts/test-guild.mjs
          node scripts/test-adventurers-path.mjs
          node --check adventurers-path.js
          node --check auth.js
          grep -q 'SEND TEST EMAIL TO ME' dev-tools.js
          grep -q 'sendTestGameUpdate' auth.js
          node --check health-connect.js
          node --check rpg-combat.js
          node scripts/test-health-connect.mjs
          node scripts/test-rpg-combat.mjs
          grep -q 'crawler-vault.png' app.js
          grep -q 'step-treasury.png' app.js
          grep -q 'Sanctum art direction: weathered dungeon stone and iron' styles.css
          grep -q 'DUNGEON ATMOSPHERE 2.0' styles.css
          grep -q 'data-game-section' app.js
          grep -q 'facilityImages\[f\[0\]\]' app.js
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'development-updated')
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout latest Development source
        uses: actions/checkout@v4
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: promotion/development-latest
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
          path: development-source
      - name: Stage Development web app for Preview deployment
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='supabase/' --exclude='README.md' development-source/ ./
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
