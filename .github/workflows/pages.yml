name: Deploy Duo Dungeon Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check application syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check health-connect.js
          node --check rpg-combat.js
          node scripts/test-health-connect.mjs
          node scripts/test-rpg-combat.mjs
      - name: Verify platform step-sync onboarding
        run: |
          grep -q 'CHOOSE YOUR STEP-SYNC METHOD' app.js
          grep -q 'APPLE HEALTH' app.js
          grep -q 'HEALTH CONNECT' app.js
          grep -q 'sync-method-option' styles.css
          grep -q 'health_connect' setup.html
          grep -q 'health_connect' auth.js
          grep -q 'step_platform' auth.js
          grep -q 'selectedStepPlatform==="health_connect"' app.js
          grep -q 'ANDROID HEALTH CONNECT' app.js
          grep -q 'android-sync-status' styles.css
          grep -q 'styles.css?v=20261110androidhealth1' index.html
          grep -q 'app.js?v=20261110huntprofile1' index.html
          grep -q 'rpg-combat.js?v=20261110rpgcombat1' index.html
          grep -q 'rpg-combat.css?v=20261110huntprofile1' index.html
          grep -q 'data-page="combat"' index.html
          grep -q 'health-connect.js?v=20261110androidhealthconnect1' index.html
          grep -q 'READ_STEPS' scripts/prepare-android-health.mjs
          grep -q 'capacitor.js' scripts/prepare-web.mjs
          grep -q 'Health Data Privacy' privacypolicy.html

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
