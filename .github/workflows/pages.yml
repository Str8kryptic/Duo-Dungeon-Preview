name: Deploy Duo Dungeon Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check application syntax
        run: |
          node --check app.js
          node --check auth.js
      - name: Verify platform step-sync onboarding
        run: |
          grep -q 'CHOOSE YOUR STEP-SYNC METHOD' app.js
          grep -q 'APPLE HEALTH' app.js
          grep -q 'HEALTH CONNECT' app.js
          grep -q 'sync-method-option' styles.css
          grep -q 'health_connect' setup.html
          grep -q 'health_connect' auth.js
          grep -q 'step_platform' auth.js
          grep -q 'app.js?v=20261110devhealthshortcut1' index.html

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
