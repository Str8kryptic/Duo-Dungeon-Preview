name: Orb Floor 1–10 Focused Browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/orb-floor10-qa.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out latest Orb development source
        uses: actions/checkout@v4
        with:
          repository: Str8kryptic/Duo-Dungeon
          ref: feature/orb-v2-equipment-pages-art
          token: ${{ secrets.PRODUCTION_SYNC_TOKEN }}
      - name: Install Chromium driver
        run: npm install --no-save playwright-core@1.58.2
      - name: Accept real Floor 1–5 sequential campaign clearance
        env:
          ORB_MAX_FLOOR: "5"
        run: node tests/campaign-floors1-10-acceptance.cjs
      - name: Accept real Floor 1 choices, reload, and objective
        run: node tests/campaign-floor1-regression.cjs
      - name: Validate actual Floor 1 combat, rewards, clearance and saved unlock
        run: node tests/campaign-floor1-clearance.cjs
      - name: Run live Floor 1–10 expedition navigation probe
        run: node tests/campaign-floor10-probe.cjs

      - name: Probe real Floor 1 decision, engagement and reload
        run: node tests/campaign-floor1-playthrough-probe.cjs
      - name: Diagnose Floor 1 environmental decision and persistence
        run: node tests/campaign-floor1-choice-diagnostic.cjs
      - name: Inspect original room-choice handler and event precedence
        run: node tests/campaign-room-event-source-probe.cjs
